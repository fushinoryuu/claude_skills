[project]
name = "claude-skills"
version = "0.1.0"
description = "QA skills for AI coding agents, with a shared eval runner"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
    "python-dotenv",
    "pyyaml",
]

[dependency-groups]
dev = [
    "poethepoet",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Short commands, run as `uv run poe <task>`. CI calls the underlying commands directly.
[tool.poe.tasks]
lint = "ruff check ."
unit = "pytest tests/unit"
structure = "pytest tests/structure"
test = "pytest"
# Align Markdown tables in every tracked .md file; check-tables only reports (see tools/format_tables.py)
fmt-tables = "python -m tools.format_tables"
check-tables = "python -m tools.format_tables --check"
check = ["lint", "check-tables", "test"]
# Extra arguments are appended: `uv run poe eval --skill qa-review --runs 3`
eval = "python -m evals.runner"
# The sample skill used to test the runner (no real skills needed)
eval-sample = "python -m evals.runner --skill todo-check --skills-dir tests/data/eval-sample/skills --evals-dir tests/data/eval-sample/evals"
triggers-sample = "python -m evals.runner --skill todo-check --triggers --skills-dir tests/data/eval-sample/skills --evals-dir tests/data/eval-sample/evals"
