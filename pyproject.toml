[project]
name = "claude-skills"
version = "0.1.0"
description = "QA skills for AI coding agents, with a shared eval runner"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
    "python-dotenv",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
