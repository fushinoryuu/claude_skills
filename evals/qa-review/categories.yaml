key_field: category
# The line that opens the Jira comment the skill drafts (the title line, which may be bold or numbered).
comment_start: '^[^\w\n]*(?:\d+(?:st|nd|rd|th) )?(?:Initial|Final) QA Review - '
values:
  - missing-tests
  - unmet-acceptance-criterion
  - missing-interface-doc-update
  - missing-input-validation
  - missing-error-handling
  - unsafe-data-change
  - excessive-permissions
  - missing-edge-case-coverage
  - other
