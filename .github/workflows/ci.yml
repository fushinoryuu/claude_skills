name: CI

# Runs lint, the Markdown format check, and unit and structure tests only. Evals are run manually (see evals/).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check Markdown formatting
        run: npm run format:check-md

      - name: Unit tests
        run: uv run pytest tests/unit --cov --cov-report=term --cov-report=json

      - name: Comment on the PR with the coverage report
        if: github.event_name == 'pull_request'
        uses: fushinoryuu/gha-workflows/.github/actions/code-coverage-pr-comment@main
        with:
          test-framework: pytest
          coverage-report-path: ./coverage.json

      - name: Structure tests
        run: uv run pytest tests/structure
