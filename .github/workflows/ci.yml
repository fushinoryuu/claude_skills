name: CI

# Runs lint, the Markdown format check, and unit and structure tests only. Evals are run manually (see evals/).
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check Markdown formatting
        run: npm run format:check-md

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Structure tests
        run: uv run pytest tests/structure
