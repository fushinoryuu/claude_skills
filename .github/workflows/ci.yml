name: CI

# Runs lint, the Markdown format check, and unit and structure tests only. Evals are run manually (see evals/).
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check Markdown formatting
        run: npm run format:check-md

      - name: Unit tests
        run: uv run pytest tests/unit --cov --cov-report=term --cov-report=json

      # The token of a Dependabot or fork PR is read-only, so it cannot comment.
      - name: Comment on the PR with the coverage report
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        uses: fushinoryuu/gha-workflows/.github/actions/code-coverage-pr-comment@main
        with:
          test-framework: pytest
          coverage-report-path: ./coverage.json

      - name: Structure tests
        run: uv run pytest tests/structure
