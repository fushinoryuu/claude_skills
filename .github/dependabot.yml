# Dependabot version updates. One weekly PR per ecosystem for minor and patch updates,
# so the PR count stays small. Major updates get their own PR so each one is reviewed alone.
version: 2

updates:
  # Actions used in .github/workflows (checkout, setup-uv, setup-node)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # Python: pyproject.toml and uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  # Node: Prettier only, package.json and package-lock.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      node-minor-and-patch:
        update-types:
          - minor
          - patch
